name: Comment edit draft retention proof

on:
  pull_request:
    paths:
      - "src/features/diff/**"
      - "evidence/diff/comment-edit-drafts/**"
      - ".github/workflows/diff-comment-edit-drafts.yml"

permissions:
  contents: read

jobs:
  paired:
    name: Comment-edit drafts paired component RED/GREEN
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python3 evidence/diff/comment-edit-drafts/run-paired.py --self-test
      - run: python3 evidence/diff/comment-edit-drafts/run-paired.py --out "${{ runner.temp }}/comment-edit-drafts-proof"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: comment-edit-drafts-component-proof
          path: ${{ runner.temp }}/comment-edit-drafts-proof
          if-no-files-found: error

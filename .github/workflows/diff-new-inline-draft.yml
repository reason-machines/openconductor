name: New inline comment draft remount proof

on:
  pull_request:
    paths:
      - "src/features/diff/**"
      - "evidence/diff/new-inline-draft-remount/**"
      - ".github/workflows/diff-new-inline-draft.yml"

permissions:
  contents: read

jobs:
  paired:
    name: New inline drafts paired mounted RED/GREEN
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python3 evidence/diff/new-inline-draft-remount/run-paired.py --self-test
      - run: python3 evidence/diff/new-inline-draft-remount/run-paired.py --out "${{ runner.temp }}/new-inline-draft-proof"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: new-inline-draft-remount-proof
          path: ${{ runner.temp }}/new-inline-draft-proof
          if-no-files-found: error

name: Keybindings

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  keybindings:
    name: Keybindings registry + logic tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Extractor and generator parse
        run: node --check tools/keybindings_extract.mjs && node --check tools/keybindings_gen.mjs
      - name: Generated registry is up to date
        run: node tools/keybindings_gen.mjs --check
      - name: Unit tests
        run: node --experimental-strip-types --test src/keybindings/*.test.ts
      - name: Build
        run: npm run build
      - name: End-to-end shortcuts (real key presses in the runner's Chrome)
        run: npm run test:e2e
      - name: Retain scroll input diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scroll-input-${{ github.sha }}
          path: test-results/scroll-input.json
          if-no-files-found: ignore
          retention-days: 7

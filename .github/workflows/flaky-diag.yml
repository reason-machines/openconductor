# TEMPORARY (issue #177): loop the flaky tests on the CI runner image and
# count failures. Removed before merge.
name: flaky-diag

on:
  pull_request:

permissions:
  contents: read

jobs:
  loop:
    if: startsWith(github.head_ref, 'reason/openconductor-fix-flaky-')
    name: flaky loop (ubuntu-22.04)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Configure git identity for tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.invalid"
      - run: npm ci
      - run: npm run build
      - name: Build lib test binary
        working-directory: src-tauri
        run: |
          bin=$(cargo test --locked --lib --no-run --message-format=json \
            | jq -r 'select(.reason=="compiler-artifact" and .profile.test==true and .executable!=null) | .executable' | head -1)
          echo "BIN=$bin" >> "$GITHUB_ENV"
          echo "test binary: $bin"; nproc; uname -a; cat /proc/sys/kernel/pid_max; ls -l /bin/sh
      - name: Loop
        working-directory: src-tauri
        run: |
          hogs=()
          for i in $(seq $(( $(nproc) * 2 ))); do ( while :; do :; done ) & hogs+=($!); done
          run_loop() { # name n args...
            local name=$1 n=$2; shift 2; local fail=0
            for i in $(seq "$n"); do
              if ! out=$("$BIN" "$@" 2>&1); then
                fail=$((fail+1))
                echo "::group::$name run $i failed"; echo "$out" | grep -v '^test .* ok$'; echo "::endgroup::"
              fi
            done
            echo "RESULT $name runs=$n failures=$fail" | tee -a "$GITHUB_STEP_SUMMARY"
          }
          run_loop kill-old-probe 2000 terminal::tests::diag_old_probe::old_probe_kill_stops_the_whole_process_group --exact
          run_loop kill-fixed 2000 terminal::tests::kill_group::kill_stops_the_whole_process_group --exact
          run_loop drop-fixed 500 agent::claude_session::tests::drop_kills_a_running_process --exact
          run_loop full-lib-fixed 40
          kill "${hogs[@]}" 2>/dev/null || true

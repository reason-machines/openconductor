name: Package (macOS)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    name: Bundle and sign OpenConductor.app (ad-hoc)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # rust-cache restores target/ after checkout, so artifacts of the path crates
      # (crates/scripts, crates/openconductor-db) look newer than their changed sources
      # and Cargo reuses them stale. Rebuild them every run.
      - name: Rebuild path crates
        working-directory: src-tauri
        run: cargo clean -p oc-scripts -p openconductor-db
      - run: npm ci
      - name: Build and sign (ad-hoc, hardened runtime)
        run: scripts/package-macos.sh --identity -
      - name: Check the bundle against the packaging contract
        run: |
          python3 tools/check_macos_bundle.py src-tauri/target/debug/bundle/macos/OpenConductor.app \
            --signing adhoc --report bundle-check.json
      - name: Zip the bundle
        run: ditto -c -k --keepParent src-tauri/target/debug/bundle/macos/OpenConductor.app OpenConductor-debug.zip
      - name: Retain original asset witnesses
        run: |
          python3 tools/collect_macos_asset_witness.py --source-commit "$GITHUB_SHA" \
            > asset-witness.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OpenConductor-debug-macos
          path: |
            OpenConductor-debug.zip
            bundle-check.json
            frontend-codegen-witness.zip
            asset-witness.json
          retention-days: 7

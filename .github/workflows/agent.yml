name: Agent

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Agent module test + clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: rustfmt
        run: rustfmt --edition 2021 --check src-tauri/src/agent/*.rs
      - name: Test agent module
        run: bash tools/agent/run-rust-tests.sh
      - name: Keychain round trip (macOS login Keychain)
        if: runner.os == 'macOS'
        timeout-minutes: 5
        run: bash tools/agent/run-rust-tests.sh keychain -- --ignored

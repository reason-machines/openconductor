name: Moved comment anchors proof

on:
  pull_request:
    paths:
      - "src/features/diff/**"
      - "evidence/diff/moved-comment-anchors/**"
      - ".github/workflows/diff-moved-comment-anchors.yml"

permissions:
  contents: read

jobs:
  paired:
    name: Moved-anchor paired component RED/GREEN
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python3 evidence/diff/moved-comment-anchors/run-paired.py --self-test
      - run: python3 evidence/diff/moved-comment-anchors/run-paired.py --out "${{ runner.temp }}/moved-anchor-proof"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moved-comment-anchor-component-proof
          path: ${{ runner.temp }}/moved-anchor-proof
          if-no-files-found: error

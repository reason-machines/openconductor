name: workspace-tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  workspace:
    name: Workspace lifecycle tests (rustc --test)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Build tests (deny warnings)
        working-directory: src-tauri/src/workspace
        run: rustc --edition 2021 -D warnings --cfg workspace_std_only --test mod.rs -o "$RUNNER_TEMP/workspace-tests"
      - name: Run tests
        # From the repo root so the busy-state test can compare with evidence/scripts/bin/git-busy-check.sh.
        run: '"$RUNNER_TEMP/workspace-tests"'
      - name: Markdown read confinement (no GUI)
        run: cargo test --locked --manifest-path tools/markdown-read-tests/Cargo.toml
      - name: Native QA pure startup and storage boundaries (no GUI)
        run: |
          rustc --edition 2021 -D warnings --cfg workspace_std_only --test src-tauri/src/native_qa.rs -o "$RUNNER_TEMP/native-qa-tests"
          "$RUNNER_TEMP/native-qa-tests"
          rustc --edition 2021 -D warnings --cfg workspace_std_only --test src-tauri/src/native_qa_cache.rs -o "$RUNNER_TEMP/native-qa-cache-tests"
          "$RUNNER_TEMP/native-qa-cache-tests"
          rustc --edition 2021 -D warnings --cfg workspace_std_only --test src-tauri/src/visual_qa_profile.rs -o "$RUNNER_TEMP/visual-qa-profile-tests"
          "$RUNNER_TEMP/visual-qa-profile-tests"
          python3 evidence/qa/ordinary-visual-startup/verify_boundary.py

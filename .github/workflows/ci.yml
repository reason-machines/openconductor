name: CI

# Cost policy (Sven, 2026-11-12): only the cheap ubuntu jobs run automatically,
# on pull_request. Every heavy, Rust or macOS job, and every other workflow in
# this folder, is workflow_dispatch only. Do not add push/pull_request triggers.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bounded APT setup regression tests (no package installs)
        run: python3 tools/ci/test_apt_install.py -v
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: No colour literals outside src/theme/
        run: npm run lint:colors
      - name: Isolated DOM test dependencies
        timeout-minutes: 3
        shell: bash
        env:
          ONBOARDING_DOM_DEPS: ${{ runner.temp }}/onboarding-dom-deps
        run: |
          npm install --prefix "$ONBOARDING_DOM_DEPS" --cache "$RUNNER_TEMP/onboarding-dom-cache" \
            --ignore-scripts --no-audit --no-fund --package-lock=false --save-exact jsdom@26.1.0
      - name: Frontend unit tests
        env:
          NODE_ENV: development
          ONBOARDING_DOM_DEPS: ${{ runner.temp }}/onboarding-dom-deps
        run: node --test "src/**/*.test.ts"
      - name: Window fill across interface zoom and resize
        run: node --test tests/e2e/window-fill.e2e.mjs
      - name: Native QA isolation verifier tests (no GUI)
        run: python3 -W error::ResourceWarning -m unittest tools/test_native_qa.py tools/test_native_qa_webkit.py tools/test_native_qa_ordinary.py tools/test_native_qa_cache.py tools/test_native_qa_stdio.py tools/test_native_qa_jsonl.py -v
      - name: Synthetic storage payload fixture tests (no WebKit)
        run: node --test tools/test_native_qa_storage.mjs
      - run: npm run build
      - name: Fixed chrome and contained pane scrolling
        run: node --test tests/e2e/scroll-containment.e2e.mjs

  app:
    name: Tauri app check, test, clippy (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    env:
      # The fs/http/shell/sql plugins (sqlx, reqwest) push the debug target past
      # the Linux runner's free disk; CI needs no debuggable binaries.
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Install Tauri system deps (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 20
        run: tools/ci/apt-install.sh libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # rust-cache restores target/ after checkout, so artifacts of the path crates
      # (crates/scripts, crates/openconductor-db) look newer than their changed sources
      # and Cargo reuses them stale. Rebuild them every run.
      - name: Rebuild path crates
        working-directory: src-tauri
        run: cargo clean -p oc-scripts -p openconductor-db
      - name: Configure git identity for tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.invalid"
      - run: npm ci
      # generate_context! embeds dist/, so the frontend must be built first.
      - run: npm run build
      - name: cargo check, test, clippy
        working-directory: src-tauri
        run: |
          cargo check --locked --all-targets
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings

  rust:
    name: Rust build + test (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Configure git identity for tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.invalid"
      - name: Checkpoint module build, test and clippy
        run: bash evidence/checkpoint/run-tests.sh
      - name: Bundled bin/ tools (checkpointer.sh, git-busy-check.sh shims) end to end
        run: bash scripts/test-bin-tools.sh
      - name: PR module build, test and clippy
        run: bash evidence/pr/run-tests.sh
      - name: Quick open module build, test and clippy
        run: bash evidence/quick_open/run-tests.sh

  scripts:
    name: Scripts crate build + test (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    defaults:
      run:
        working-directory: crates/scripts
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
        env:
          RUSTFLAGS: -D warnings

  db:
    name: Persistence crate (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    defaults:
      run:
        working-directory: crates/openconductor-db
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo test
        env:
          RUSTFLAGS: -D warnings
      - run: cargo clippy --all-targets -- -D warnings
      - name: App persistence module (src-tauri/src/persistence) build, test and clippy
        run: bash ../../evidence/persistence/run-tests.sh
      - name: Agent binaries store (src-tauri/src/agent_binaries.rs) build, test and clippy
        run: bash ../../evidence/persistence/agent-binaries/run-tests.sh

  tools:
    name: Evidence tools compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile tools/*.py tools/ui-map/*.py
      - name: Scope-aware UI-map report regression tests
        run: python -m unittest discover -s tools/ui-map -p 'test_scope.py'
      - name: Parity checklist anchors resolve in REA evidence
        run: python tools/parity_chat_diff_pr.py --check-anchors --out-dir "$RUNNER_TEMP/parity"
      - name: Packaging reference matches the REA evidence bundle
        run: |
          python tools/packaging_ref.py
          git diff --exit-code evidence/packaging/conductor-reference.json
      - name: Bundle checker unit tests
        run: python -m unittest tools/test_check_macos_bundle.py
      - name: Parity checker runs on this tree (settings, shortcuts, persistence, packaging)
        run: python tools/parity_check.py check --ref HEAD --out-dir "$RUNNER_TEMP/parity-ssp"
      - name: Sidebar/Home/create parity references resolve and the checker runs
        run: |
          python tools/parity_sidebar_home_create.py validate
          python tools/parity_sidebar_home_create.py score --tree . > /dev/null
          python tools/parity_sidebar_home_create.py obligations --tree . > /dev/null

  frontend-unit:
    name: Frontend unit tests (node --test)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Chat top-level find frozen component regression
        run: node --test --test-reporter=tap tests/chat-search/transcriptFind.component.test.mjs
      - name: Isolated DOM test dependencies
        timeout-minutes: 3
        shell: bash
        env:
          ONBOARDING_DOM_DEPS: ${{ runner.temp }}/onboarding-dom-deps
        run: |
          npm install --prefix "$ONBOARDING_DOM_DEPS" --cache "$RUNNER_TEMP/onboarding-dom-cache" \
            --ignore-scripts --no-audit --no-fund --package-lock=false --save-exact \
            react@18.3.1 react-dom@18.3.1 typescript@5.9.3 jsdom@26.1.0 @testing-library/user-event@14.6.1
      - name: Pure TypeScript modules (Node strips types natively)
        env:
          NODE_ENV: development
          ONBOARDING_DOM_DEPS: ${{ runner.temp }}/onboarding-dom-deps
        run: node --test "src/**/*.test.ts"
      - name: Custom branch-prefix unchanged-fixture baseline and candidate replay
        timeout-minutes: 3
        run: |
          python3 -m unittest discover -s evidence/settings/custom-prefix -p test_replay.py -v
          python3 evidence/settings/custom-prefix/replay.py --out-dir "$RUNNER_TEMP/custom-prefix-replay"
      - name: Script output copy and Unicode unchanged-fixture differential replays
        timeout-minutes: 4
        run: |
          python3 -m unittest discover -s evidence/scripts/output-copy -p test_replay.py -v
          python3 evidence/scripts/output-copy/replay.py --out-dir "$RUNNER_TEMP/output-copy-replay"
          python3 evidence/scripts/output-unicode/verify-source.py
          python3 -m unittest discover -s evidence/scripts/output-unicode -p test_replay.py -v
          python3 evidence/scripts/output-unicode/replay.py --out-dir "$RUNNER_TEMP/output-unicode-replay"
      - name: Retain script output differential receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: script-output-differential-${{ github.sha }}
          path: |
            ${{ runner.temp }}/output-copy-replay/
            ${{ runner.temp }}/output-unicode-replay/
          if-no-files-found: ignore
      - name: Onboarding persistence and nonblocking startup regressions
        timeout-minutes: 3
        shell: bash
        env:
          NODE_ENV: development
          ONBOARDING_DOM_DEPS: ${{ runner.temp }}/onboarding-dom-deps
          REACT_EFFECTS_DEPS: ${{ github.workspace }}/node_modules
        run: |
          echo "Onboarding source commit: $(git rev-parse HEAD)"
          node --check tests/onboarding-strict-effects.test.mjs
          node --test --test-reporter=tap tests/onboarding-effects.test.mjs tests/onboarding-strict-effects.test.mjs tests/onboarding-media.test.mjs
          node --test --test-reporter=tap tests/chat-search/*.dom.test.mjs

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Frontend typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: No colour literals outside src/theme/
        run: npm run lint:colors
      - name: Frontend unit tests
        run: node --test "src/**/*.test.ts"
      - name: Window fill across interface zoom and resize
        run: node --test tests/e2e/window-fill.e2e.mjs
      - name: Native QA isolation verifier tests (no GUI)
        run: python3 -W error::ResourceWarning -m unittest tools/test_native_qa.py tools/test_native_qa_webkit.py tools/test_native_qa_ordinary.py tools/test_native_qa_cache.py -v
      - name: Synthetic storage payload fixture tests (no WebKit)
        run: node --test tools/test_native_qa_storage.mjs
      - run: npm run build

  app:
    name: Tauri app check, test, clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      # The fs/http/shell/sql plugins (sqlx, reqwest) push the debug target past
      # the Linux runner's free disk; CI needs no debuggable binaries.
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Install Tauri system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # rust-cache restores target/ after checkout, so artifacts of the path crates
      # (crates/scripts, crates/openconductor-db) look newer than their changed sources
      # and Cargo reuses them stale. Rebuild them every run.
      - name: Rebuild path crates
        working-directory: src-tauri
        run: cargo clean -p oc-scripts -p openconductor-db
      - name: Configure git identity for tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.invalid"
      - run: npm ci
      # generate_context! embeds dist/, so the frontend must be built first.
      - run: npm run build
      - name: cargo check, test, clippy
        working-directory: src-tauri
        run: |
          cargo check --locked --all-targets
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings

  rust:
    name: Rust build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Configure git identity for tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.invalid"
      - name: Checkpoint module build, test and clippy
        run: bash evidence/checkpoint/run-tests.sh
      - name: Bundled bin/ tools (checkpointer.sh, git-busy-check.sh shims) end to end
        run: bash scripts/test-bin-tools.sh
      - name: PR module build, test and clippy
        run: bash evidence/pr/run-tests.sh
      - name: Quick open module build, test and clippy
        run: bash evidence/quick_open/run-tests.sh

  scripts:
    name: Scripts crate build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    defaults:
      run:
        working-directory: crates/scripts
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
        env:
          RUSTFLAGS: -D warnings

  db:
    name: Persistence crate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    defaults:
      run:
        working-directory: crates/openconductor-db
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo test
        env:
          RUSTFLAGS: -D warnings
      - run: cargo clippy --all-targets -- -D warnings
      - name: App persistence module (src-tauri/src/persistence) build, test and clippy
        run: bash ../../evidence/persistence/run-tests.sh
      - name: Agent binaries store (src-tauri/src/agent_binaries.rs) build, test and clippy
        run: bash ../../evidence/persistence/agent-binaries/run-tests.sh

  tools:
    name: Evidence tools compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile tools/*.py tools/ui-map/*.py
      - name: Scope-aware UI-map report regression tests
        run: python -m unittest discover -s tools/ui-map -p 'test_scope.py'
      - name: Parity checklist anchors resolve in REA evidence
        run: python tools/parity_chat_diff_pr.py --check-anchors --out-dir "$RUNNER_TEMP/parity"
      - name: Packaging reference matches the REA evidence bundle
        run: |
          python tools/packaging_ref.py
          git diff --exit-code evidence/packaging/conductor-reference.json
      - name: Bundle checker unit tests
        run: python -m unittest tools/test_check_macos_bundle.py
      - name: Parity checker runs on this tree (settings, shortcuts, persistence, packaging)
        run: python tools/parity_check.py check --ref HEAD --out-dir "$RUNNER_TEMP/parity-ssp"
      - name: Sidebar/Home/create parity references resolve and the checker runs
        run: |
          python tools/parity_sidebar_home_create.py validate
          python tools/parity_sidebar_home_create.py score --tree . > /dev/null
          python tools/parity_sidebar_home_create.py obligations --tree . > /dev/null

  frontend-unit:
    name: Frontend unit tests (node --test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Pure TypeScript modules (Node strips types natively)
        run: node --test "src/**/*.test.ts"

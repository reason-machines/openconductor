name: Terminal

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  script-output:
    name: Script output browser regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - name: Script output colors, streaming, rerun and resize
        run: node --test tests/e2e/script-output.e2e.mjs
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}

  rust:
    name: Terminal Rust test + clippy + rustfmt (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Test terminal module (real PTYs)
        run: bash tools/terminal/run-rust-tests.sh

      - name: WebDriver transport and startup tests
        run: node --experimental-strip-types --test tests/e2e/webdriver.test.mjs tests/e2e/startup.test.mjs tests/e2e/terminal-flow.test.mjs tools/e2e/reason-chat-settings.test.mjs
      - name: Reason chat e2e (fake reason acp)
        timeout-minutes: ${{ inputs.reason_chat_runs == '5' && 75 || 15 }}
        env:
          E2E_OUT: ${{ runner.temp }}/e2e-screens
          E2E_RUNS: ${{ inputs.reason_chat_runs || '1' }}
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
        run: |
          for pass in $(seq 1 "$E2E_RUNS"); do
            echo "Reason chat suite pass $pass/$E2E_RUNS on $GITHUB_SHA"
            E2E_OUT="$E2E_OUT/pass-$pass" xvfb-run -a node tools/e2e/reason-chat.e2e.mjs src-tauri/target/debug/openconductor
            echo "Reason chat suite pass $pass/$E2E_RUNS passed on $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@v4
        if: always()

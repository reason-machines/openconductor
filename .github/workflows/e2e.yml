name: E2E

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tauri:
    name: Tauri debug build under Xvfb (tauri-driver)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system deps, WebKitWebDriver and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            webkit2gtk-driver xvfb
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: e2e
      - name: Install tauri-driver
        run: cargo install tauri-driver --locked
      - run: npm ci
      # `tauri build --debug` embeds dist/ (custom protocol), so no dev server is needed.
      - name: Debug build
        run: npx tauri build --debug --no-bundle
      - name: Configure git identity
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.invalid"
      - name: Run e2e flows under Xvfb
        env:
          OC_APP: src-tauri/target/debug/openconductor
          E2E_OUT: e2e-artifacts
        run: xvfb-run --auto-servernum --server-args="-screen 0 1440x900x24" node tests/e2e/run.mjs
      - name: Upload screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-tauri
          path: e2e-artifacts
          if-no-files-found: warn

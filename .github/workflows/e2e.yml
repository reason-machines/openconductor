name: E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      reason_chat_runs:
        description: Consecutive Reason chat suite passes on the built app
        type: choice
        options: ["1", "5"]
        default: "1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The app downloads the pinned Claude Code and Codex at startup and chats
# prefer them (src-tauri/src/agent_launch.rs). An empty release manifest keeps
# every lane on its stand-in CLIs (PATH / executable path) instead of racing a
# real download; agent-binaries.e2e.mjs points this at its own local mirror.
env:
  OPENCONDUCTOR_AGENT_BINARY_MANIFEST: ${{ github.workspace }}/tools/e2e/no-agent-binaries.json

jobs:
  codex-chat:
    name: Codex chat through the built app (ubuntu-22.04)
    runs-on: ubuntu-22.04
    # Includes a real Reason CLI install in each disposable test HOME.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Pin exact historical Codex diagnostic source
        id: codex-diagnostic-source
        if: github.event_name == 'pull_request' && github.head_ref == 'reason/openconductor-sol-e2e-ow-acc3b5c5' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          DIAGNOSTIC_PR_HEAD: ${{ github.event.pull_request.head.sha }}
          DIAGNOSTIC_WORKFLOW_MERGE: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, subprocess
          output = pathlib.Path(os.environ["RUNNER_TEMP"]) / "e2e-codex"
          output.mkdir(parents=True, exist_ok=True)
          synthetic = "eff3c0588599dcb2392a982a2fcd96e856006817"
          base = "9e4df51294ab5cd6abdd73aa1212ae501c551b13"
          head = os.environ["DIAGNOSTIC_PR_HEAD"]
          paths = [
              "src/components/WorkspaceView.tsx",
              "tools/e2e/codex-chat.e2e.mjs",
              "tools/e2e/codex-access-diagnostics.mjs",
              "tools/e2e/codex-access-diagnostics.test.mjs",
          ]
          receipt = {
              "workflowMerge": os.environ["DIAGNOSTIC_WORKFLOW_MERGE"],
              "publishedHead": head,
              "historicalSynthetic": synthetic,
              "expectedParents": [
                  "74e48d1354ff54e3ef252558d41f2edf242a2248",
                  "58e7d6625d65eae2b45c3b8e6461b96d3d7a1743",
              ],
              "expectedSourceTree": "3d74639fd422b0f70c7b239dd3481f5393bcd7a9",
              "expectedOverlayTree": "4c94e034e36ddeefe1aef801999924e5bc18b721",
              "sourcePinVerified": False,
          }
          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()
          try:
              if not re.fullmatch(r"[0-9a-f]{40}", head):
                  raise ValueError("Published head must be an immutable SHA")
              subprocess.run(["git", "fetch", "--no-tags", "--depth=1", "origin", synthetic, base, head], check=True)
              headers = git("cat-file", "commit", synthetic).split("\n\n", 1)[0].splitlines()
              receipt["observedParents"] = [line[7:] for line in headers if line.startswith("parent ")]
              receipt["observedSourceTree"] = git("rev-parse", synthetic + "^{tree}")
              if receipt["observedParents"] != receipt["expectedParents"] or receipt["observedSourceTree"] != receipt["expectedSourceTree"]:
                  raise ValueError("Historical synthetic identity mismatch")
              patch = subprocess.check_output([
                  "git", "diff", "--binary", "--full-index", "--no-ext-diff", "--no-textconv", "--no-color",
                  "--no-renames", "--diff-algorithm=myers", "--src-prefix=a/", "--dst-prefix=b/",
                  base, head, "--", *paths,
              ])
              receipt["patchSha256"] = hashlib.sha256(patch).hexdigest()
              if receipt["patchSha256"] != "5b7f31ae0fa3b42b78c51b6d29a1831e0db1e82a166a22f51c6ccef6306af39f":
                  raise ValueError("Four-path diagnostic patch mismatch")
              (output / "codex-diagnostic.patch").write_bytes(patch)
              before = git("show", synthetic + ":tools/e2e/codex-chat.e2e.mjs").splitlines()
              subprocess.run(["git", "checkout", "--detach", synthetic], check=True)
              subprocess.run(["git", "apply", "--index", "--whitespace=error-all"], input=patch, check=True)
              receipt["observedOverlayTree"] = git("write-tree")
              if receipt["observedOverlayTree"] != receipt["expectedOverlayTree"]:
                  raise ValueError("Built-source overlay tree mismatch")
              subprocess.run(["git", "diff", "--exit-code"], check=True)
              after = pathlib.Path("tools/e2e/codex-chat.e2e.mjs").read_text().splitlines()
              assertions = [line for line in before if "assert." in line]
              if len(assertions) != 55 or assertions != [line for line in after if "assert." in line]:
                  raise ValueError("Original policy assertions changed")
              receipt["originalAssertionLinesPreserved"] = len(assertions)
              source_lock = pathlib.Path("src-tauri/Cargo.lock").read_bytes()
              (output / "source-Cargo.lock").write_bytes(source_lock)
              receipt["sourceCargoLockSha256"] = hashlib.sha256(source_lock).hexdigest()
              receipt["sourcePinVerified"] = True
          except Exception as error:
              receipt["failure"] = str(error)
              raise
          finally:
              serialized = json.dumps(receipt, indent=2) + "\n"
              (output / "codex-source-provenance.json").write_text(serialized)
              print(serialized)
          PY
      # The Azure apt mirror sometimes serves at 30-50 kB/s for 10-25 minutes, so keep the
      # downloaded .debs in the Actions cache (one key per ISO week; restore-keys reuse last week's).
      - name: apt cache key
        id: apt-key
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Restore apt archives
        id: apt-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-e2e-${{ runner.os }}-22.04-v1-${{ steps.apt-key.outputs.week }}
          restore-keys: apt-e2e-${{ runner.os }}-22.04-v1-
      - name: Install Tauri system deps, WebKitWebDriver and Xvfb
        # About 30 seconds with a warm cache or a healthy mirror. The script bounds each apt attempt
        # (5 min) and moves to the next mirror on a retry.
        timeout-minutes: 20
        env:
          APT_ARCHIVES: ${{ runner.temp }}/apt-archives
        run: |
          tools/ci/apt-install.sh libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            webkit2gtk-driver xvfb
      # Saved right away so a later E2E failure still keeps the downloads. Both jobs race to save
      # the same key; the loser only logs a warning.
      - name: Save apt archives
        if: steps.apt-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-e2e-${{ runner.os }}-22.04-v1-${{ steps.apt-key.outputs.week }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # Same as the reason-chat job: rust-cache restores stale artifacts of the
      # path crates, so rebuild them every run.
      - name: Rebuild path crates
        working-directory: src-tauri
        run: cargo clean -p oc-scripts -p openconductor-db
      - run: npm ci
      - name: Build the app (debug, no bundle)
        run: npx tauri build --debug --no-bundle
      - name: Retain Codex diagnostic build provenance
        if: always() && github.event_name == 'pull_request' && github.head_ref == 'reason/openconductor-sol-e2e-ow-acc3b5c5' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          python3 - <<'PY'
          import difflib, hashlib, json, pathlib, re, os
          output = pathlib.Path(os.environ["RUNNER_TEMP"]) / "e2e-codex"
          output.mkdir(parents=True, exist_ok=True)
          report = {"sourcePinVerified": False, "effectiveLockCaptured": False}
          try:
              pin = json.loads((output / "codex-source-provenance.json").read_text())
              report.update({key: pin.get(key) for key in [
                  "sourcePinVerified", "workflowMerge", "publishedHead", "historicalSynthetic",
                  "observedSourceTree", "observedOverlayTree", "sourceCargoLockSha256",
              ]})
              report["proofLabel"] = "pinned source; build outcome remains in job log" if report["sourcePinVerified"] else "source pin failed; not exact-source proof"
              effective = pathlib.Path("src-tauri/Cargo.lock").read_bytes()
              (output / "effective-Cargo.lock").write_bytes(effective)
              report["effectiveCargoLockSha256"] = hashlib.sha256(effective).hexdigest()
              report["effectiveLockCaptured"] = True
              source = (output / "source-Cargo.lock").read_bytes()
              (output / "cargo-lock-build.diff").write_text("".join(difflib.unified_diff(
                  source.decode().splitlines(True), effective.decode().splitlines(True),
                  fromfile="source-Cargo.lock", tofile="effective-Cargo.lock",
              )))
              def packages(raw):
                  result = []
                  root = None
                  for block in raw.decode().split("[[package]]")[1:]:
                      fields = dict(re.findall(r'^(name|version|source|checksum) = "([^"]*)"$', block, re.M))
                      if fields.get("name") == "openconductor":
                          match = re.search(r"^dependencies = \[\n(.*?)^\]", block, re.M | re.S)
                          root = set(re.findall(r'^\s*"([^"]+)",?$', match.group(1), re.M)) if match else set()
                      else:
                          result.append(tuple(fields.get(key) for key in ["name", "version", "source", "checksum"]))
                  return set(result), root
              original_packages, original_edges = packages(source)
              effective_packages, effective_edges = packages(effective)
              report["resolvedPackageIdentityDifferences"] = len(original_packages ^ effective_packages)
              if original_edges is None or effective_edges is None:
                  report["rootDependencyDeltaUnavailable"] = True
              else:
                  report["rootDependencyEdgesAdded"] = sorted(effective_edges - original_edges)
                  report["rootDependencyEdgesRemoved"] = sorted(original_edges - effective_edges)
              app = pathlib.Path("src-tauri/target/debug/openconductor")
              report["binarySha256IfPresent"] = hashlib.sha256(app.read_bytes()).hexdigest() if app.is_file() else None
          except Exception as error:
              report["captureError"] = str(error)
          finally:
              serialized = json.dumps(report, indent=2) + "\n"
              (output / "codex-build-provenance.json").write_text(serialized)
              print(serialized)
          PY
      - name: Install tauri-driver
        run: cargo install tauri-driver --locked
      - name: Configure git identity
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.invalid"
      # tools/e2e/fake_codex_app_server.py replays a turn recorded from Codex 0.166.0 on macOS.
      - name: Codex chat e2e (stand-in codex app-server)
        # Includes the real Reason CLI setup budget.
        timeout-minutes: 15
        env:
          E2E_OUT: ${{ runner.temp }}/e2e-codex
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
        run: xvfb-run -a node tools/e2e/codex-chat.e2e.mjs src-tauri/target/debug/openconductor
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codex-chat-e2e-screens
          path: ${{ runner.temp }}/e2e-codex
          retention-days: 14
      # tools/e2e/fake_claude.py stands in for `claude`: an existing login in a fresh HOME, then the
      # API key and CLI (subscription login) modes of Settings › Agents › Claude Code.
      - name: Claude Code chat e2e (stand-in claude, each auth mode)
        if: always()
        # Includes the real Reason CLI setup budget.
        timeout-minutes: 15
        env:
          E2E_OUT: ${{ runner.temp }}/e2e-claude
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
        run: xvfb-run -a node tools/e2e/claude-chat.e2e.mjs src-tauri/target/debug/openconductor
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: claude-chat-e2e-screens
          path: ${{ runner.temp }}/e2e-claude
          retention-days: 14
      # The chat's bundled-binary download banner, against a local stand-in release host.
      - name: Agent binary download banner e2e
        if: always()
        # Includes the real Reason CLI setup budget.
        timeout-minutes: 15
        env:
          E2E_OUT: ${{ runner.temp }}/e2e-binary
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
        run: xvfb-run -a node tools/e2e/agent-binary-banner.e2e.mjs src-tauri/target/debug/openconductor
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-binary-banner-e2e-screens
          path: ${{ runner.temp }}/e2e-binary
          retention-days: 14

  reason-chat:
    name: Reason chat through the built app (ubuntu-22.04)
    # WebDriver for Tauri apps exists on Linux (WebKitWebDriver) and Windows
    # only; macOS WKWebView has no driver.
    runs-on: ubuntu-22.04
    # Includes real CLI setup per suite, plus the optional five-pass chat run.
    timeout-minutes: 120
    steps:

[package]
name = "openconductor-dot-prefix-boundary"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[lib]
path = "harness.rs"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
toml = { version = "=0.8.2", features = ["preserve_order"] }
oc-scripts = { path = "../../../../../crates/scripts" }

[profile.dev]
debug = 0

[profile.test]
debug = 0

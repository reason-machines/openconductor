[package]
name = "oc-scripts"
version = "0.1.0"
edition = "2021"
publish = false
description = "OpenConductor workspace setup, run and archive scripts: settings layers, script env and ports, process-group runner"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = { version = "0.8", features = ["preserve_order"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

# Standalone until the Tauri crate exists; it then depends on this by path.
[workspace]

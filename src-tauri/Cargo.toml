[package]
name = "openconductor"
version = "0.1.0"
description = "OpenConductor: run coding agents in parallel workspaces"
edition = "2021"
publish = false

[lib]
name = "openconductor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

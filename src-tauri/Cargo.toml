[package]
name = "openconductor"
version = "0.1.0"
description = "OpenConductor: run coding agents in parallel git worktrees"
edition = "2021"
publish = false

[lib]
name = "openconductor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "=0.9.0"
libc = "0.2"
base64 = "0.21"
# quick_open/ (same crates Conductor links for its file picker)
ignore = "0.4.25"
nucleo-matcher = "=0.3.1"
unicode-segmentation = "1.10"
toml = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(workspace_std_only)", "cfg(quick_open_std_only)", "cfg(diff_std_only)"] }

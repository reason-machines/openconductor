[package]
name = "openconductor"
version = "0.1.0"
description = "OpenConductor: run coding agents in parallel git worktrees"
edition = "2021"
publish = false

[lib]
name = "openconductor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
# Plugins Conductor 0.87.6 links (evidence/ipc/rust-crates-from-paths.txt); the commands its
# frontend calls are in evidence/packaging/conductor-plugin-commands.json.
tauri-plugin-clipboard-manager = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
tauri-plugin-process = "2"
tauri-plugin-store = "2"
tauri-plugin-window-state = "2"
tauri-plugin-fs = { version = "2", features = ["watch"] }
tauri-plugin-http = "2"
tauri-plugin-shell = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "=0.9.0"
# terminal screen state (terminal/screen.rs); the version Conductor links
alacritty_terminal = "=0.26.0"
libc = "0.2"
base64 = "0.21"
# terminal history entries (terminal/history_store.rs): AES-256-GCM, SHA-256 long names
aes-gcm = "0.10"
sha2 = "0.10"
# spawn_blocking for terminal history file I/O (already linked through tauri)
tokio = { version = "1", features = ["rt"] }
# quick_open/ (same crates Conductor links for its file picker)
ignore = "0.4.25"
notify = "8"
nucleo-matcher = "=0.3.1"
unicode-segmentation = "1.10"
toml = "0.8"
oc-scripts = { path = "../crates/scripts" }
# app database (conductor.db): schema and data access
openconductor-db = { path = "../crates/openconductor-db" }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(workspace_std_only)", "cfg(quick_open_std_only)", "cfg(diff_std_only)", "cfg(pr_harness)"] }
